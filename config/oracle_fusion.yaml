# ---------------------------------------------------------------------------
# Oracle Fusion AI Agent Studio target.
#
# The AI Agent Studio API needs a BEARER TOKEN (not Basic auth). The token is
# minted by the token-relay call. Easiest path: use the UI's Evaluate tab, which
# lets you paste a bearer token (or a browser session cookie + xsrf token) at
# runtime. This YAML is the CLI/base config; the UI overrides these at run time.
# ---------------------------------------------------------------------------
name: oracle_fusion_hr_policy
connector: oracle_fusion

# Your Fusion host, e.g. https://ejfh-dev4.fa.us6.oraclecloud.com
base_url: https://YOUR-FUSION-HOST

# The AI Agent Studio API is bearer-token based.
auth:
  type: bearer
  # Paste a token here, or (better) set it in the UI / an env var:
  token_env: ORACLE_FUSION_BEARER_TOKEN

options:
  agent_code: YOUR_AGENT_CODE      # the AI agent team code / name

  # How to obtain the bearer token:
  #   token -> use the token from auth (auth.token or ORACLE_FUSION_BEARER_TOKEN)
  #   relay -> mint one from the token-relay endpoint using a browser session
  auth_mode: token

  # For auth_mode: relay — the tool calls this endpoint with your session cookie
  # and xsrf token to get a fresh access_token (best set via the UI, not on disk):
  relay_path: /fscmRestApi/tokenrelay
  # relay_cookie: "<full Cookie header>"
  # relay_xsrf: "<x-xsrf-token>"

  invocation_mode: END_USER        # used on invokeAsync
  status_invocation_mode: ADMIN    # used on the status poll (?invocationMode=ADMIN)
  conversational: true
  poll_interval_s: 3
  poll_max_attempts: 100           # data_pipeline agents can take a few minutes

# Oracle returns the agent reply in the "output" field and sources in "citations".
response:
  answer_path: output
  citations_path: citations

thresholds:
  pass_score: 0.8
  partial_score: 0.5
  require_groundedness: false

concurrency: 2
max_retries: 3
timeout_s: 120
