# ---------------------------------------------------------------------------
# Local LangChain AI agent (served over HTTP on your own machine).
#
# LangChain agents are usually exposed as a REST endpoint via FastAPI/Flask or
# LangServe. Set base_url + endpoint to match your server, and make sure the
# request_template and response.answer_path match what your server expects and
# returns. Two common shapes are shown below — keep the one that matches yours.
# ---------------------------------------------------------------------------
name: langchain_local_agent
connector: generic_rest

# Your HR Policy Agent server (from the uvicorn logs).
base_url: http://127.0.0.1:8000
method: POST

# Local dev server, no auth.
auth:
  type: none

# The working endpoint from your server logs: POST /api/ask returned 200 OK.
endpoint: /api/ask

# NOTE: the request field and response field below are best guesses — verify
# them with the quick test in the chat, then adjust if your server differs.
request_template:
  question: "{question}"         # the JSON your /api/ask endpoint expects
response:
  answer_path: answer            # where the reply is in the /api/ask response
  # citations_path: sources      # uncomment if it returns sources/citations

thresholds:
  pass_score: 0.75
  partial_score: 0.5
  require_groundedness: false

concurrency: 2                   # bump up if your local server handles parallel calls
max_retries: 3
timeout_s: 120                   # local LLMs can be slow; give them room
